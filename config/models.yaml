# 모델별 예상 단가 (USD / 100만 토큰). 화면의 "예상 비용"과 월 예산 계산에 쓴다.
# ⚠️ [미확인] 아래 값은 자리표시값이다. 실제 단가는 각 회사 가격표에서 확인해 고친다.
#    (OpenRouter는 모델 페이지에 단가가 나온다. 모델 이름은 "회사/모델" 형식)
# 목록에 없는 모델은 default 단가로 계산한다.
default:
  input: 1.0
  output: 4.0
models:
  gpt-4.1-mini:
    input: 0.4
    output: 1.6
  openai/gpt-4.1-mini:
    input: 0.4
    output: 1.6
  # gpt-5-mini: OpenRouter 모델 페이지 기준 입력 $0.25 / 출력 $2.00 (2026-11 확인). 생각(reasoning) 토큰도 출력으로 센다
  gpt-5-mini:
    input: 0.25
    output: 2.0
  openai/gpt-5-mini:
    input: 0.25
    output: 2.0
  # gpt-6-luna: OpenRouter 모델 페이지 기준 입력 $0.10 / 출력 $0.50 (2026-11-19 확인)
  gpt-6-luna:
    input: 0.10
    output: 0.50
  openai/gpt-6-luna:
    input: 0.10
    output: 0.50
