# 골든 질문셋: 질문 → 기대하는 해석(의도·지역·이용자 조건)과 결과 조건.
# 결과 설명자료의 "정답률" 표가 여기서 나온다(scripts/eval_golden.py). 목표: 마감 전 50문항 이상.
# 각자 담당 에이전트 질문을 10개 이상 추가한다. 기대값은 사람이 직접 판단해서 적는다(코드 결과를 복사하지 않는다).
#
# expect 키: intent, region, days, month, mobility, vision, hearing, transport,
#            needs(이 목록이 모두 들어 있어야 함), status(ok|partial|insufficient), answer_contains,
#            origin(출발지), max_ride_min(한 번에 이동할 수 있는 시간), interests(이 목록이 모두 들어 있어야 함), verified(검증 통과 여부),
#            datasets(데이터 탐색이 반드시 고를 자료, config/catalog.yaml ID), no_datasets(고르면 안 되는 자료)
# ── 접근성 진단 (access) ──
- q: 휠체어 타는 어머니와 서귀포에 갈 만한 곳 추천해줘. 장애인 화장실 꼭 있어야 해
  expect: {intent: access, region: 서귀포시, mobility: wheelchair_manual, needs: [acc_toilet], status: ok}
- q: 전동휠체어로 애월에서 갈 만한 곳 있어?
  expect: {intent: access, region: 애월읍, mobility: wheelchair_power}
- q: 80대 부모님 모시고 제주시에서 가볼 만한 곳
  expect: {intent: access, region: 제주시, mobility: senior, status: ok}
- q: 유모차 끌고 다니기 좋은 관광지 알려줘
  expect: {intent: access, mobility: stroller, status: ok}
- q: 목발 짚고 다녀야 해서 계단 없는 곳 추천해줘
  expect: {intent: access, mobility: walker, status: ok}
- q: 시각장애가 있어 안내견과 함께 갈 수 있는 곳
  expect: {intent: access, vision: blind}
- q: 보청기를 쓰는데 표선 쪽에 괜찮은 관광지 있을까
  expect: {intent: access, region: 표선면, hearing: hard}
- q: 비 오는 날 휠체어로 갈 수 있는 실내 장소
  expect: {intent: access, mobility: wheelchair_manual, needs: [indoor_pref]}
- q: 장애인 주차 되는 중문 관광지
  expect: {intent: access, region: 중문동, needs: [acc_parking]}
- q: 1인 입장료 5천원 이하로 갈 만한 곳
  expect: {intent: access}
- q: 우도에서 휠체어로 갈 수 있는 곳
  expect: {intent: access, region: 우도면, mobility: wheelchair_manual}
# ── 코스 설계 (course) ──
- q: 유모차 끌고 2박3일 코스 짜줘. 버스로 다닐 거야
  expect: {intent: course, days: 3, mobility: stroller, transport: bus}
- q: 휠체어로 서귀포 2일 코스 짜줘 3월에
  expect: {intent: course, region: 서귀포시, days: 2, month: 3, mobility: wheelchair_manual, status: ok}
- q: 어르신과 하루 일정 짜줘 천천히 다니고 싶어
  expect: {intent: course, days: 1, mobility: senior, needs: [rest_often]}
- q: 1박 2일 제주시 동선 짜줘
  expect: {intent: course, region: 제주시, days: 2}
- q: 7월에 전동휠체어로 3일 여행 계획 짜줘
  expect: {intent: course, days: 3, month: 7, mobility: wheelchair_power}
- q: 택시 타고 성산 쪽 하루 코스
  expect: {intent: course, region: 성산읍, days: 1, transport: taxi}
- q: 장애인 화장실 있는 곳 위주로 이틀 코스
  expect: {intent: course, days: 2, needs: [acc_toilet]}
- q: 10월 3일 여행인데 코스 짜줘
  expect: {intent: course, month: 10}
- q: 4명이 렌터카로 2일 코스
  expect: {intent: course, days: 2, transport: car}
# ── 현황 (status) ──
- q: 지역별 무장애 관광지 현황 알려줘
  expect: {intent: status, status: ok}
- q: 제주시 읍면동별 장애인 화장실 현황
  expect: {intent: status, region: 제주시, status: ok}
- q: 사업계획서에 쓸 서귀포시 무장애 관광 인프라 통계
  expect: {intent: status, region: 서귀포시, status: ok}
- q: 무장애 관광지가 부족한 지역은 어디야?
  expect: {intent: status}
- q: 열린관광지 공모 준비 중인데 휠체어 대여 정보 공백이 얼마나 돼?
  expect: {intent: status}
# ── 지원하지 않음 (unsupported) ──
- q: 오늘 성산일출봉 지금 붐벼?
  expect: {intent: unsupported, answer_contains: 근거 있게 답할 수 없는}
- q: 애월 맛집 추천해줘
  expect: {intent: nearby}
- q: 휠체어 가능한 숙소 예약해줘
  expect: {intent: unsupported}
- q: 내일 날씨 어때?
  expect: {intent: unsupported}
- q: 공항에서 중문까지 길 안내해줘
  expect: {intent: unsupported}
- q: 근처 병원 알려줘
  expect: {intent: unsupported}
- q: 안녕하세요
  expect: {intent: unsupported}
# ── 보고서 ──
- q: 보고서로 정리해줘
  expect: {intent: report, answer_contains: 정리할 직전 분석이 없습니다}
# ── 출발지·이동 시간·관심사·검증 (우선 반영 항목) ──
- q: 노형동에서 출발해서 2일 코스 짜줘. 아빠가 휠체어 쓰시고 차에 30분 넘게 못 앉아 계셔
  expect: {intent: course, origin: 노형동, days: 2, mobility: wheelchair_manual, max_ride_min: 30, status: ok, verified: true}
- q: 애월에 숙소 잡았어. 어머니가 오래 못 걸으셔서 바다 보이는 곳 위주로 하루 코스
  expect: {intent: course, origin: 애월읍, days: 1, mobility: senior, interests: [sea], verified: true}
- q: 공항에서 바로 출발하는 1일 코스, 유모차 끌고 박물관 같은 실내 위주로
  expect: {intent: course, origin: 제주국제공항, mobility: stroller, interests: [museum], verified: true}
- q: 휠체어로 숲길이나 오름 갈 만한 곳 있어? 장애인 화장실 필요
  expect: {intent: access, mobility: wheelchair_manual, needs: [acc_toilet], interests: [forest], status: ok, verified: true}
- q: 성산읍에 사는데 한 번에 45분 이내로만 이동하는 2일 코스 짜줘
  expect: {intent: course, origin: 성산읍, days: 2, max_ride_min: 45, verified: true}
- q: 서귀포에서 마을 산책하기 좋은 곳, 보행기 쓰셔
  expect: {intent: access, region: 서귀포시, mobility: walker, interests: [village], verified: true}
# ── 데이터 탐색: 질문에 따라 고르는 자료가 달라져야 한다 ──
- q: 3월에 버스로 2일 코스 짜줘. 휠체어 써
  expect: {intent: course, month: 3, datasets: [bf_places, bf_points, c5_01, c5_02, c3_03, bf_nearby], no_datasets: [c1_07, c4_10], verified: true}
- q: 휠체어로 서귀포 갈 만한 곳 알려줘. 3월에 갈 거야
  expect: {intent: access, datasets: [bf_places, bf_points, bf_photos], no_datasets: [c5_02, c3_03], verified: true}
- q: 제주시 버스 정류소 가까운 무장애 관광지 현황
  expect: {intent: status, datasets: [bf_places, c3_03], no_datasets: [bf_photos, bf_nearby, c5_02], verified: true}
- q: 서귀포시 읍면동별 장애인 주차 현황
  expect: {intent: status, datasets: [bf_places], no_datasets: [c3_03, c5_02, bf_photos], verified: true}
- q: 유모차로 자가용 타고 1일 코스
  expect: {intent: course, mobility: stroller, datasets: [bf_places, bf_nearby, bf_photos], no_datasets: [c5_02, c3_03], verified: true}
# ── 장소 하나 물어보기 (수정 대화): 그 장소의 시설 상태를 근거와 함께. 상태(있음·없음·정보 없음)는 자료마다 달라 적지 않는다 ──
- q: 천지연폭포 장애인 화장실 있어?
  expect: {intent: access, answer_contains: 천지연폭포의 장애인 화장실, verified: true}
- q: 한라수목원 주차 돼?
  expect: {intent: access, answer_contains: 한라수목원의 장애인 주차, verified: true}
- q: 협재해수욕장에 경사로 있나요?
  expect: {intent: access, answer_contains: 협재해수욕장의 경사로, verified: true}
- q: 절물휴양림 휠체어 대여 가능해?
  expect: {intent: access, answer_contains: 절물휴양림의 휠체어 대여, verified: true}
# ── 11/16 추가(개발 세트 50+): 지역·감각 조건·현황 범위·범위 밖 ──
- q: 전동 스쿠터 타고 한림 쪽 하루 코스 짜줘
  expect: {intent: course, region: 한림읍, days: 1, mobility: wheelchair_power, verified: true}
- q: 구좌읍에서 눈이 잘 안 보이는 아버지랑 갈 만한 곳
  expect: {intent: access, region: 구좌읍, vision: low}
- q: 조천 쪽으로 수어 쓰는 친구랑 2일 코스
  expect: {intent: course, region: 조천읍, days: 2, hearing: deaf}
- q: 휠체어로 대정읍 갈 만한 곳, 입장료 만원 이하로
  expect: {intent: access, region: 대정읍, mobility: wheelchair_manual}
- q: 8월에 유모차로 하루 코스 짜줘. 더위가 걱정돼
  expect: {intent: course, month: 8, days: 1, mobility: stroller, datasets: [c5_02]}
- q: 렌터카 예약해줘
  expect: {intent: unsupported}
- q: 남원읍 무장애 관광지 현황 알려줘
  expect: {intent: status, region: 남원읍}
