# 데이터허브 무장애여행 원본의 자유 서술(상세정보·설명 등)에서 시설·장애물을 찾는 낱말 목록.
# scripts/convert_barrierfree.py 와 jeju_agent/data/barrierfree.py 가 쓴다.
# 규칙
# - 낱말은 공백을 지운 원문과 비교한다("장애인 화장실" = "장애인화장실").
# - 시설 낱말 뒤 8글자 안에 negative 낱말이 오면 '없음 확인'(0)으로 본다. 예: "장애인화장실 없음"
# - 하나도 안 나오면 '정보 없음'(빈칸)이다. 없다고 단정하지 않는다.
# - 실제 원본을 열어 보고 빠진 표현을 추가한다(추측으로 넣지 않는다). 바꾸면 tests/test_barrierfree.py도 확인.
facilities:
  acc_toilet: [장애인화장실, 장애인용화장실, 다목적화장실, 장애인전용화장실, 장애인화장실있음]
  acc_parking: [장애인주차, 장애인전용주차, 장애인주차장, 장애인주차구역]
  wheelchair_rental: [휠체어대여, 휠체어무료대여, 휠체어비치, 휠체어구비]
  stroller_rental: [유모차대여, 유아차대여, 유모차무료대여]
  ramp: [경사로]
  elevator: [엘리베이터, 승강기]
  braille: [점자, 점자블록, 점자안내]
  audio_guide: [음성안내, 오디오가이드, 음성해설]
negative: [없음, 없다, 없어, 미설치, 불가, 미비치, 없슴]

# 지점별 장애물 (지점 1곳에서 하나라도 나오면 그 지점에 기록)
barriers:
  stairs: [계단]
  threshold: [턱, 단차, 문턱]
  inaccessible: [접근불가, 진입불가, 이용불가, 통행불가, 휠체어불가, 접근어려움, 진입어려움]
  rough: [울퉁, 자갈, 파손, 포장상태좋지, 포장상태불량, 포장불량, 노면불량, 흙길, 모래, 요철, 돌길, 야자매트]
# 장애물 낱말이 있어도 아래 표현이면 장애물이 아니다 (예: 무턱 = 턱이 없음)
barrier_exceptions:
  threshold: [무턱, 턱없, 단차없, 문턱없, 턱이없, 단차가없]
  stairs: [계단없, 계단이없]

# 실내·실외 판단 (장소 이름·분류·서술)
indoor: [실내, 박물관, 미술관, 전시관, 기념관, 체험관, 아쿠아리움, 갤러리, 과학관, 도서관]
outdoor: [해변, 해수욕장, 해안, 포구, 숲길, 숲, 휴양림, 오름, 올레, 공원, 산책로, 둘레길, 저수지, 폭포, 마을, 습지]

# 분류 (장소 이름에 들어간 낱말 → 분류). 위에서부터 먼저 맞는 것.
categories:
  실내 전시: [박물관, 미술관, 전시관, 기념관, 과학관, 갤러리, 아쿠아리움]
  테마파크: [랜드, 월드, 파크, 테마, 민속촌, 박물관은살아있다]
  숲길: [숲, 휴양림, 숲길, 곶자왈]
  해변: [해변, 해수욕장]
  해안·포구: [포구, 해안, 바당, 등대, 환해장성, 섬]
  오름: [오름]
  올레길: [올레]
  공원: [공원, 정원, 수목원, 식물원]
  마을: [마을]
