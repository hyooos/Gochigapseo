# 접근성 판정·코스 설계 기준 (팀이 조정하는 값).
# 숫자를 바꾸면 tests/test_access.py·test_course.py 기대값과 docs/architecture.md 표도 같은 PR에서 확인한다.
#
# 경사 기준 근거: 「장애인·노인·임산부 등의 편의증진 보장에 관한 법률 시행규칙」 경사로 기울기 1/12 이하(약 4.8°),
#   부득이한 경우 1/8 이하(약 7.1°). [조항·별표 번호 확인 필요] 실외 산책로에 그대로 적용되는 기준은 아니므로
#   '자료에 기록된 지점의 경사가 이 값을 넘으면 주의·부적합'으로만 쓴다.

# 이동 방법별 경사 기준(도): ok 이하 = 적합, ok 초과 = 주의(동반자 도움 권장).
# caution을 넘는 기록은 slope_block 조건일 때만 부적합으로 본다(아래). 짧은 구간 1곳만으로 장소 전체를 빼지 않기 위함
slope:
  none: {ok: 90, caution: 90}
  wheelchair_manual: {ok: 4.8, caution: 7.2}
  wheelchair_power: {ok: 7.2, caution: 10.0}
  walker: {ok: 7.2, caution: 15.0}
  senior: {ok: 7.2, caution: 15.0}
  stroller: {ok: 7.2, caution: 15.0}

# 경사로 '부적합'이 되는 조건 (둘 중 하나라도 맞으면):
#   caution 기준을 넘는 경사 기록이 count곳 이상이거나, 최대 경사가 caution + margin도 이상
#   (예: 수동 휠체어는 7.2° 초과 기록 2곳 이상, 또는 11.2° 이상 1곳). 그 밖의 caution 초과는 '주의'
# 2026-11-15 실데이터 171곳 기준 수동 휠체어: 이전(1곳이라도 초과면 부적합) 적합 17·주의 49·부적합 105
#   → 지금 적합 17·주의 75·부적합 79. 조사 지점 목록(place_points)이 없으면 이전 방식(1곳이라도 초과면 부적합)
slope_block: {count: 2, margin: 4.0}

# 이동 방법별로 '주의'가 되는 장애물(지점 1곳 이상 기록 시).
# block_share: 전체 조사 지점 중 계단·접근불가 지점 비율이 이 값 이상이면 부적합
barriers:
  none: {caution: [], block_share: 1.01}
  wheelchair_manual: {caution: [stairs, threshold, inaccessible, rough], block_share: 0.5}
  wheelchair_power: {caution: [stairs, threshold, inaccessible, rough], block_share: 0.5}
  walker: {caution: [stairs, rough], block_share: 1.01}
  senior: {caution: [stairs], block_share: 1.01}
  stroller: {caution: [stairs, rough], block_share: 1.01}

# 점수(0~100). 판정이 같으면 점수 순으로 추천한다.
score:
  base: 60                     # 시설·관심사 가산점이 붙을 여유를 둔다(최대 100)
  per_caution_reason: 15       # '주의' 이유 1개당 (확인된 장애물·경사만. '정보 없음'은 점수에 섞지 않고 비율로 따로 표시)
  per_barrier_point: 3         # 장애물 기록 지점 1곳당 (최대 barrier_cap)
  barrier_cap: 20
  per_slope_degree_over: 3     # 경사가 ok 기준을 넘는 1도당
  facility_bonus: 4            # 이용자에게 도움이 되는 시설이 '있음 확인'일 때 1개당
  indoor_bonus: 10             # 실내를 원하는데 실내 중심 장소일 때
  interest_bonus: 15           # 관심사(바다·숲길·박물관·마을)와 장소 분류가 맞을 때

min_suitable: 3                # 적합이 이보다 적으면 '주의'까지 후보에 넣는다(규칙 판단)
stale_years: 5                 # 자료 기준일이 이보다 오래되면 '자료 노후' 경고

# 장소 카드의 '전화로 물어볼 말'. 자료에 '정보 없음'인 시설과 기록된 장애물만 골라 묻는다
# (전화번호는 무장애 자료에 없다 [미확인: 데이터허브 관광지 정보와 결합 가능 여부])
call_questions:
  acc_toilet: "장애인 화장실이 있나요? 있다면 입구에서 얼마나 떨어져 있나요?"
  acc_parking: "장애인 전용 주차 칸이 있나요?"
  wheelchair_rental: "휠체어를 빌릴 수 있나요? 미리 예약해야 하나요?"
  stroller_rental: "유아차를 빌릴 수 있나요?"
  ramp: "입구에 계단 대신 경사로가 있나요?"
  elevator: "층을 옮겨야 하면 엘리베이터가 있나요?"
  braille: "점자 안내나 점자블록이 있나요?"
  audio_guide: "음성 안내(오디오 가이드)를 쓸 수 있나요?"
  stairs_spot: "자료에 계단·접근 불가로 기록된 곳({spots})을 피해서 다닐 수 있는 길이 있나요?"
  stairs: "계단 없이 둘러볼 수 있는 길이 있나요?"
  slope: "경사가 급한 구간이 있다고 기록돼 있는데, 우회로가 있나요?"
  # 확인할 점(key_checks)의 정보가 자료에 없을 때 묻는 말
  slope_unknown_wheel: "입구부터 둘러보는 길까지 오르막·내리막이 휠체어로 다닐 만한가요? 경사로나 평탄한 길이 있나요?"
  slope_unknown_walk: "오르막·내리막이 심하지 않은 길로 천천히 둘러볼 수 있나요? 중간에 쉴 의자가 있나요?"
  stairs_unknown: "계단 없이 들어가고 둘러볼 수 있나요?"
  inaccessible_unknown: "휠체어로 갈 수 없는 구간이 있나요?"
  fee: "입장료가 있나요? 장애인·경로 할인이 되나요?"
  closing: "오늘 운영하나요? 휴무일도 알려 주세요."

# 이동 조건별 '확인할 점' (판정은 바꾸지 않고, 장소 카드에 상태를 보여 준다).
# 항목: slope(최대 경사) · stairs(계단 지점) · inaccessible(접근 불가 지점). 자료에 없으면 '방문 전 추가 확인 필요' + 전화 질문
key_checks:
  wheelchair_manual: {title: "경사도·계단·접근 불가 지점 확인", items: [slope, stairs, inaccessible], ask: slope_unknown_wheel}
  wheelchair_power: {title: "경사도·계단·접근 불가 지점 확인", items: [slope, stairs, inaccessible], ask: slope_unknown_wheel}
  walker: {title: "경사도 등 관련 정보 확인", items: [slope, stairs], ask: slope_unknown_walk}
  senior: {title: "경사도 등 관련 정보 확인", items: [slope], ask: slope_unknown_walk}
  stroller: {title: "경사도·계단 확인", items: [slope, stairs], ask: slope_unknown_walk}

# 코스 설계
course:
  start: {name: 제주국제공항, lat: 33.5066, lng: 126.4929}   # 숙소를 모르면 날마다 여기서 출발한다고 본다
  road_factor: 1.3             # 직선거리 → 도로 거리 보정 [가정: 지도 API 연결 전 추정치]
  speed_kmh: {car: 40, taxi: 40, bus: 18}
  bus_wait_min: 15
  pace:
    여유: {per_day: 2, visit_min: 90, day_minutes: 360}
    보통: {per_day: 3, visit_min: 60, day_minutes: 480}
  relaxed_profiles: [wheelchair_manual, senior]   # 이 이동 방법이거나 rest_often이면 '여유'만 쓴다
  default_max_leg_min: 45
  leg_penalty_per_min: 0.8     # 다음 장소 고를 때 점수 - 이동시간(분) × 이 값
  extras_max_km: {car: 10, taxi: 10, bus: 3}   # 차로 15분 안팎·버스는 걸어서 갈 만한 거리[가정]    # 코스 장소에서 이 거리(추정) 안의 식당·숙소만 코스에 넣는다(다른 무장애 코스 주변으로 조사된 곳 포함)
  toilet_first_max_extra_min: 15   # 화장실 필요 조건: 장애인 화장실 있는 식당을 먼저 고르되, 화장실 정보 없는 가까운 식당보다 이만큼(분) 넘게 더 가면 가까운 쪽 [가정]
  max_days: 5

# 날씨 위험 (센터 5-02 일일 날씨 정보로 계산, 여행 달과 같은 달의 과거 자료)
weather:
  rain_mm: 1.0                 # 이 값 이상이면 '비 온 날'
  wind_ms: 14.0                # 최대풍속이 이 값 이상이면 '강풍일' (강풍주의보 기준 풍속 참고) [기준 확인 필요]
  hot_c: 33.0                  # 최고기온이 이 값 이상이면 '폭염일'
  rain_ratio_high: 0.35        # 비 온 날 비율이 이 값 이상이면 하루 1곳은 실내 장소를 넣는다
  wind_ratio_high: 0.20
  hot_ratio_high: 0.20
  min_days: 20                 # 관측 일수가 이보다 적으면 '표본 부족' 경고

# 대중교통
bus:
  near_m: {wheelchair_manual: 300, wheelchair_power: 300, default: 500}

# 검증 에이전트(jeju_agent/verify.py): 자료가 보장하지 못하는 단정 표현(정규식). 걸리면 LLM 설명 대신 문장틀을 쓴다
verify:
  forbidden:
    - "안전합니다"
    - "안전하게\\s*(?:갈|다닐|이용할)\\s*수\\s*있"
    - "문제(?:가)?\\s*없(?:습니다|어요|음)"
    - "보장합니다"
    - "100\\s*%\\s*(?:안전|가능|이용)"
    - "완벽(?:하게|한|히)"
    - "확실히\\s*(?:갈|이용|다닐)"
    - "걱정\\s*(?:없|마세요|하지\\s*마)"
